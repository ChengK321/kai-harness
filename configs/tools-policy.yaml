# Tool Executor 全局安全基线；未知能力一律拒绝。
# Registry 负责描述，Policy 负责约束，冲突时取更严格规则。
version: "1.0"
default_action: deny

# 当前没有授予工具权限；新增条目必须经过注册和审核。
tools: {}

# 所有调用强制应用的资源、网络、文件与审批边界。
constraints:
  require_registered_tool: true
  require_correlation_id: true
  max_execution_seconds: 120
  max_output_bytes: 1048576
  # 网络默认关闭，文件系统也没有隐含访问根目录。
  network_access: deny
  filesystem:
    read_roots: []
    write_roots: []
  # 破坏、提权或外部副作用操作至少需要审批。
  approval:
    required_for:
      - destructive_action
      - privilege_escalation
      - external_side_effect

# 请求和结果都要审计，落盘前必须移除敏感值。
audit:
  log_requests: true
  log_results: true
  redact_sensitive_values: true

# 扩展不能放宽 default_action 或审批基线。
extensions: {}
